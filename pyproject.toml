[project]
name = "expense-tracker"
version = "0.1.0"
description = "Gestor de gastos personales en Python con persistencia en JSON y CLI"
authors = [
    { name = "BoscoGlez", email = "jbgonzalez1311@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "uvicorn>=0.54.0",
]
[tool.mypy]
exclude = ["prueba_pydantic.py", "prueba_gasto.py"]
